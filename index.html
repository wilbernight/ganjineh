<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>گنجینه</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/assets/app.css?v=10">
<script>try{var t=localStorage.getItem("lfs-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
/* ================= 6.0 — Drive-style layout ================= */
html,body{overflow-x:hidden}
body{background:var(--surface)}
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);grid-template-rows:72px minmax(0,1fr);height:100vh}
/* sidebar */
.side{grid-column:1;grid-row:1/-1;display:flex;flex-direction:column;padding:14px 0 14px;background:var(--surface);border-inline-end:1px solid var(--border);min-height:0;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;height:44px;padding:0 24px;margin-bottom:18px;cursor:pointer}
.brand img{width:36px;height:36px}
.brand b{font-size:21px;font-weight:800;color:var(--text);letter-spacing:-.2px}
.new-btn{display:inline-flex;align-items:center;gap:14px;align-self:flex-start;height:52px;margin:0 16px 18px;padding:0 26px 0 22px;border:0;border-radius:999px;background:var(--surface);color:var(--text);font:inherit;font-size:16px;font-weight:600;cursor:pointer;
  box-shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);transition:box-shadow .15s,background .15s}
.new-btn:hover{box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);background:color-mix(in srgb,var(--primary) 4%,var(--surface))}
.new-btn .plus svg{width:26px;height:26px;display:block;fill:none;stroke-width:3;stroke-linecap:round}
/* animated + New */
.new-btn{position:relative;overflow:hidden;animation:nb-in .7s cubic-bezier(.2,1.4,.4,1) both .15s}
.new-btn .plus{display:block;transition:transform .45s cubic-bezier(.3,1.7,.45,1);animation:nb-spin .9s cubic-bezier(.2,1.2,.4,1) both .25s}
.new-btn .plus path{stroke-dasharray:16;stroke-dashoffset:0;animation:nb-draw .6s ease-out both .35s}
.new-btn .plus path+path{animation-delay:.5s}
.new-btn>span:last-child{transition:letter-spacing .3s}
.new-btn:hover .plus{transform:rotate(90deg) scale(1.12)}
.new-btn:active{transform:scale(.97)}
.new-btn.open .plus{transform:rotate(135deg) scale(1.05)}
.new-btn.open{background:var(--primary-soft);box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15)}
.new-btn .rip,#upBtn .rip{position:absolute;border-radius:50%;background:color-mix(in srgb,var(--primary) 22%,transparent);transform:scale(0);animation:nb-rip .6s ease-out forwards;pointer-events:none}
#upBtn .rip{background:rgba(255,255,255,.35)}
#upBtn{overflow:hidden}
#upBtn svg{transition:transform .45s cubic-bezier(.3,1.7,.45,1)}
#upBtn.open svg{transform:rotate(135deg)}
@keyframes nb-in{from{opacity:0;transform:translateY(-6px) scale(.7)}}
@keyframes nb-spin{from{transform:rotate(-270deg) scale(.3)}}
@keyframes nb-draw{from{stroke-dashoffset:16}}
@keyframes nb-rip{to{transform:scale(2.6);opacity:0}}
.nav{display:flex;flex-direction:column;gap:1px;padding-inline-end:12px}
.nav h6{margin:14px 0 4px;padding:12px 28px 0;border-top:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text-3)}
.nav button{display:flex;align-items:center;gap:18px;height:40px;padding:0 26px;border:0;border-radius:0 999px 999px 0;background:none;color:var(--text);cursor:pointer;text-align:start;font-size:14.5px;font-weight:500;min-width:0}
[dir="rtl"] .nav button{border-radius:999px 0 0 999px}
.nav button span.l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav button:hover{background:var(--surface-2)}
.nav button.on{color:var(--on-soft);background:var(--primary-soft);font-weight:700}
.nav button svg.i{width:20px;height:20px;color:var(--text-2)}
.nav button.on svg.i{color:var(--on-soft)}
.nav button .av{width:22px;height:22px;font-size:12.5px}
.nav button[hidden]{display:none}
.nav2{margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
.nav2:not(:has(button:not([hidden]):not(.mob))){display:none}
.nav .mob{display:none}
.store{margin:auto 0 0;padding:16px 26px 4px;border-top:1px solid var(--border)}
.store[hidden]{display:none}
.st-h{display:flex;align-items:center;gap:14px;margin-bottom:10px;color:var(--text)}
.st-h svg{width:20px;height:20px;color:var(--text-2)}
.st-h b{font-size:14.5px;font-weight:600}
.st-bar{height:4px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin:0 0 8px}
.st-bar i{display:block;height:100%;background:var(--primary);border-radius:4px}
.st-bar.low i{background:var(--danger)}
.store small{display:block;font-size:13px;color:var(--text-3)}
.store .st-low{color:var(--danger)}
.ver{padding:4px 26px 0;font-size:12.5px;color:var(--text-3)}
.side-scrim{display:none}
/* top bar */
.top{grid-column:2;grid-row:1;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid var(--border);background:var(--surface);position:relative;z-index:20}
.menu-btn{display:none}
.search{position:relative;flex:1;max-width:720px;height:48px;display:flex;align-items:center;gap:12px;padding:0 18px;border-radius:24px;background:var(--bg);transition:background .15s,box-shadow .15s}
.search>svg{width:20px;height:20px;color:var(--text-2);flex:none}
.search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;font-size:16px;color:var(--text)}
.search input::placeholder{color:var(--text-3)}
.search input::-webkit-search-cancel-button{display:none}
.search:focus-within{background:var(--surface);box-shadow:0 1px 1px rgba(65,69,73,.3),0 1px 3px 1px rgba(65,69,73,.15)}
.search.open{border-radius:24px 24px 0 0;box-shadow:0 1px 3px 1px rgba(60,64,67,.15),0 4px 8px 3px rgba(60,64,67,.1)}
.q-x{width:36px;height:36px;border:0;border-radius:50%;background:none;color:var(--text-2);cursor:pointer;display:grid;place-items:center}
.q-x:hover{background:var(--surface-2)}
.q-x[hidden]{display:none}
.sugg{position:absolute;top:100%;inset-inline:0;padding:0 0 10px;background:var(--surface);border-radius:0 0 24px 24px;border-top:1px solid var(--border);box-shadow:0 8px 14px rgba(60,64,67,.15);max-height:min(70vh,520px);overflow:auto}
.sugg[hidden]{display:none}
.sg{display:flex;align-items:center;gap:14px;width:100%;height:44px;padding:0 22px;border:0;background:none;color:var(--text);font:inherit;font-size:14.5px;cursor:pointer;text-align:start}
.sg:hover,.sg.kb{background:var(--primary-soft)}
.sg:hover .sg-n,.sg.kb .sg-n{color:var(--on-soft)}
.sg-i{width:20px;height:20px;display:grid;place-items:center;flex:none}
.sg-i svg{width:20px;height:20px}
.sg>svg.i{width:18px;height:18px;color:var(--text-3)}
.sg-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
.sg-n b{color:var(--text);font-weight:700}
.sg-w{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text-3);white-space:nowrap}
.sg-w svg{width:16px;height:16px}
.sg-h{display:flex;align-items:center;justify-content:space-between;padding:12px 22px 4px;margin-top:6px;border-top:1px solid var(--border);font-size:13px;color:var(--text-3)}
.sg-h button{border:0;background:none;color:var(--primary);font:inherit;font-weight:700;cursor:pointer;padding:0}
.sg-none{padding:14px 22px;font-size:14px;color:var(--text-3)}
.top-acts{display:flex;align-items:center;gap:4px;margin-inline-start:auto}
.ticon{width:40px;height:40px;border:0;border-radius:50%;background:none;color:var(--text-2);cursor:pointer;display:grid;place-items:center;text-decoration:none}
.ticon:hover{background:var(--surface-2);color:var(--text)}
.ticon svg{width:21px;height:21px}
.ticon[hidden]{display:none}
.host{display:flex;align-items:center;gap:8px;margin-inline-end:10px;font-size:13.5px;color:var(--text-3)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px var(--success-soft)}
.me{display:flex;align-items:center;gap:12px;margin-inline-start:12px;white-space:nowrap;cursor:default}
.me .av{width:36px;height:36px;border-radius:50%;font-size:16px;order:2}
.me .mt{order:1;text-align:end}
.me .mt b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.me .mt small{display:block;font-size:13px;color:var(--text-3)}
/* page header (white) */
.content{grid-column:2;grid-row:2;overflow:auto;min-height:0;background:var(--bg);padding:0 0 40px}
.dash{display:none}
.phead{position:relative;padding:20px 40px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.ph-row{display:flex;align-items:center;gap:16px}
.hero-t{flex:1;min-width:0}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:2px;font-size:13.5px;min-height:18px}
.crumbs:not(:has(svg)){display:none}
.crumbs button{border:0;background:none;padding:1px 4px;border-radius:6px;cursor:pointer;color:var(--text-3);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs button:hover{color:var(--primary)}
.crumbs button:last-child{display:none}
.crumbs svg{width:14px;height:14px;color:var(--text-3)}
.crumbs svg:last-of-type{display:none}
.ptitle{display:inline-flex;align-items:center;gap:6px;max-width:100%;margin:0 -10px;padding:2px 10px;border:0;border-radius:10px;background:none;color:var(--text);cursor:pointer}
.ptitle:hover{background:var(--surface-2)}
.ptitle svg{width:20px;height:20px;color:var(--text-2)}
#ptitle{margin:0;font-size:22px;font-weight:600;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:6px}
#upBtn{display:none}
.filters{margin-top:14px;flex-wrap:wrap;gap:10px}
.fl{font-size:13.5px;color:var(--text-3)}
.stats{margin-inline-start:auto;font-size:13px;color:var(--text-3);white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0}
.chips[hidden]{display:none}
.chips button{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;transition:background .12s,border-color .12s}
.chips button svg{width:16px;height:16px;color:var(--folder)}
.chips button:hover{background:var(--surface-2)}
.chips button.on{background:var(--primary-soft);border-color:var(--primary-soft);color:var(--on-soft)}
.chips button.on svg{color:var(--primary)}
.chips button .c{font-size:13px;color:var(--text-3)}
.chips button[hidden]{display:none}
.cols{display:block;padding:24px 40px 0}
.maincol{min-width:0}
.rail{display:none}
h2.sec{margin:0 0 14px;font-size:14.5px;font-weight:600;color:var(--text-2)}
h2.sec:not(:first-child){margin-top:30px}
/* folders: Drive tiles */
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.fcard{position:relative;display:flex;align-items:center;gap:14px;height:56px;padding:0 10px 0 16px;border-radius:10px;background:var(--surface);box-shadow:0 1px 2px rgba(60,64,67,.12);user-select:none;transition:box-shadow .12s,background .12s}
.fcard:hover{box-shadow:0 1px 3px rgba(60,64,67,.2),0 4px 10px rgba(60,64,67,.08)}
.fcard .cb{display:none;width:24px;height:24px;flex:none;align-items:center;justify-content:center;cursor:pointer}
.fcard .cb input{width:18px;height:18px;margin:0;cursor:pointer}
.fcard:hover .cb,.fcard.sel .cb,.fcards.selecting .cb{display:flex}
.fcard:hover .fc-ic,.fcard.sel .fc-ic,.fcards.selecting .fc-ic{display:none}
.fc-ic{display:grid;place-items:center;cursor:pointer;flex:none}
.fold{width:24px;height:24px;fill:var(--folder);stroke:none}
.fc-n{flex:1;min-width:0;cursor:pointer}
.fc-n b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .more{opacity:0;color:var(--text-2)}
.fcard:hover .more,.fcard.sel .more{opacity:1}
.fcard.sel{background:var(--primary-soft);box-shadow:none}
.fcard.sel .fold{fill:var(--primary)}
.fcard.sel .fc-n b{color:var(--on-soft)}
/* files: Drive table */
.panel{display:block;background:none}
.thead,.tr{display:grid;grid-template-columns:40px minmax(0,1fr) 200px 140px 48px;align-items:center}
.thead{height:44px;font-size:13.5px;font-weight:500;color:var(--text-2);border-bottom:1px solid var(--border-strong)}
.thead button{border:0;background:none;color:inherit;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:2px 0}
.thead button:hover{color:var(--text)}
.thead button svg{width:15px;height:15px;opacity:0}
.thead button.on{color:var(--text);font-weight:600}
.thead button.on svg{opacity:.8}
.thead button.on.asc svg{transform:rotate(180deg)}
.tr{height:56px;border-bottom:1px solid var(--border);user-select:none;transition:background .1s}
.tr:hover{background:var(--row-hover)}
.tr.sel{background:var(--primary-soft);border-bottom-color:color-mix(in srgb,var(--primary) 18%,var(--border))}
.tr.sel .nm b{color:var(--on-soft)}
.tr.cut{opacity:.5}
.cell-n{display:flex;align-items:center;gap:16px;min-width:0;padding-inline-end:12px}
.cell-n .nm{min-width:0;cursor:pointer}
.cell-n .nm b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-n .nm b:hover{color:var(--primary)}
.cell-n .nm small{display:none;font-size:13px;color:var(--text-3)}
.cell-d,.cell-s{font-size:14px;color:var(--text-2)}
.cb{display:grid;place-items:center}
.cb input{appearance:none;width:18px;height:18px;border:2px solid var(--text-3);border-radius:3px;background:var(--surface);cursor:pointer;display:grid;place-items:center;margin:0}
.cb input:checked,.cb input:indeterminate{background:var(--primary);border-color:var(--primary)}
.cb input:checked::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.cb input:indeterminate::after{content:"";width:8px;height:2px;background:#fff}
.tr .cb input{opacity:0}
.tr:hover .cb input,.tr.sel .cb input,.panel.selecting .cb input{opacity:1}
.more{opacity:0;color:var(--text-2)}
.tr:hover .more,.tr.sel .more{opacity:1}
.fi{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:4px;overflow:hidden}
.fi img{width:100%;height:100%;object-fit:cover;border-radius:4px}
.fi svg{width:22px;height:26px}
.fi .fold{width:24px;height:24px}
/* card view */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.gc{position:relative;display:flex;flex-direction:column;background:var(--surface);border-radius:10px;border:1px solid var(--border);overflow:hidden;user-select:none;transition:box-shadow .12s}
.gc:hover{box-shadow:0 1px 3px rgba(60,64,67,.2),0 4px 10px rgba(60,64,67,.08)}
.gc.sel{background:var(--primary-soft);border-color:var(--primary-soft)}
.gc .pv{height:140px;margin:0;display:grid;place-items:center;background:var(--surface-2);cursor:pointer;overflow:hidden;border-bottom:1px solid var(--border)}
.gc .pv img{width:100%;height:100%;object-fit:cover}
.gc .pv svg{width:52px;height:60px}
.gc .pv .fold{width:64px;height:64px}
.gc .meta{padding:10px 8px 10px 14px;display:flex;align-items:center;gap:6px}
.gc .meta div{min-width:0;flex:1}
.gc .meta b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc .meta small{font-size:13px;color:var(--text-3)}
.gc .cb{position:absolute;top:10px;inset-inline-start:10px}
.gc .cb input{opacity:0}
.gc:hover .cb input,.gc.sel .cb input,.grid.selecting .cb input{opacity:1}
/* banner */
.banner{display:flex;align-items:center;gap:14px;padding:14px 16px;margin:0 0 18px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.banner .bi{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.banner>div:nth-child(2){flex:1;min-width:0}
.banner b{display:block;font-size:15px}
.banner small{display:block;font-size:13.5px;color:var(--text-2)}
.curl{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;max-width:100%}
.curl .u{cursor:pointer;border-bottom:1px dashed currentColor;word-break:break-all}
.curl .u:hover{color:var(--primary,#2563eb)}
.curl .cb{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border:1px solid var(--border,#d0d5dd);border-radius:7px;background:var(--surface,#fff);color:inherit;font:inherit;font-size:12.5px;cursor:pointer;flex:none}
.curl .cb:hover{border-color:var(--primary,#2563eb)}
.curl .cb svg{width:14px;height:14px}
.banner .back{flex:none;height:38px;font-size:14px}
/* selection bar */
.selbar{display:none;align-items:center;gap:6px;height:52px;padding:0 10px;margin:0 0 14px;border-radius:14px;background:var(--text);color:var(--surface);box-shadow:var(--shadow-lg)}
.selbar.show{display:flex}
.selbar b{font-weight:600;padding:0 6px;font-size:15px}
.selbar .btn{height:36px;border:0;background:rgba(255,255,255,.12);color:inherit}
.selbar .btn:hover{background:rgba(255,255,255,.22)}
.selbar .btn.icon{width:36px}
.selbar .sp{flex:1}
/* empty / loading */
.empty{padding:56px 24px;text-align:center;color:var(--text-2);background:var(--surface);border-radius:16px;box-shadow:var(--shadow-sm)}
.empty svg.ill{width:190px;height:148px;margin-bottom:12px}
.empty h3{margin:0 0 6px;font-size:18px;font-weight:800;color:var(--text)}
.empty p{margin:0 0 20px;font-size:15px}
.skel{height:58px;border-radius:12px;background:var(--surface);display:flex;align-items:center;gap:14px;padding:0 54px;margin-bottom:8px}
.skel i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
/* dropzone */
#drop{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--primary) 12%,transparent);backdrop-filter:blur(2px)}
#drop.show{display:flex}
#drop div{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border:2px dashed var(--primary);border-radius:20px;padding:36px 56px;box-shadow:var(--shadow-lg)}
#drop svg{width:40px;height:40px;color:var(--primary)}
#drop b{font-size:17px}
#drop small{color:var(--text-3)}
/* menus */
.menu{position:fixed;z-index:60;min-width:230px;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);display:none;animation:pop .12s ease}
.menu.show{display:block}
.menu button{display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 12px;border:0;border-radius:9px;background:none;cursor:pointer;color:var(--text);text-align:start;font-size:14.5px}
.menu button:hover{background:var(--surface-2)}
.menu button svg{width:18px;height:18px;color:var(--text-2)}
.menu button.dz,.menu button.dz svg{color:var(--danger)}
.menu button.dz:hover{background:var(--danger-soft)}
.menu button .kbd{margin-inline-start:auto}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 4px}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
/* dialogs (title, close, grey fields, pill actions) */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(18,20,19,.38);display:none;align-items:center;justify-content:center;padding:16px}
.scrim.show{display:flex}
.dlg{position:relative;width:100%;max-width:460px;max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);padding:24px;animation:pop .15s ease}
.dlg-x{position:absolute;top:20px;inset-inline-end:18px;width:34px;height:34px;border:0;border-radius:50%;background:none;color:var(--text);cursor:pointer;display:grid;place-items:center}
.dlg-x:hover{background:var(--surface-2)}
.dlg .ic{display:none}
.dlg h3{margin:0 0 4px;padding-inline-end:44px;font-size:20px;font-weight:800}
.dlg h3+p{color:var(--text-3)}
.dlg>p{margin:0 0 18px;padding-bottom:16px;border-bottom:1px solid var(--border);color:var(--text-2);font-size:14.5px;word-break:break-word}
.dlg .input{margin-bottom:18px}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
.dlg .acts .btn{min-width:96px;height:42px}
.dlg .acts .btn:not(.primary):not(.danger){background:var(--surface-2);border-color:transparent}
.dlg .acts .btn:not(.primary):not(.danger):hover{background:var(--surface-3)}
.dlg.wide{max-width:620px}
/* preview */
.pvw{position:fixed;inset:0;z-index:80;background:rgba(14,16,15,.92);display:none;flex-direction:column}
.pvw.show{display:flex}
.pvw .bar{height:64px;display:flex;align-items:center;gap:10px;padding:0 16px;color:#eceeed}
.pvw .bar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pvw .bar .btn{background:rgba(255,255,255,.1);border-color:transparent;color:#eceeed}
.pvw .bar .btn:hover{background:rgba(255,255,255,.18)}
.pvw .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 72px 24px;position:relative}
.pvw .stage img,.pvw .stage video{max-width:100%;max-height:100%;border-radius:10px}
.pvw .stage iframe{width:100%;height:100%;border:0;border-radius:10px;background:#fff}
.pvw .stage pre{width:100%;max-width:960px;height:100%;overflow:auto;margin:0;padding:20px;border-radius:12px;background:#1a1d1c;color:#dfe3e1;font:13px/1.6 ui-monospace,Consolas,monospace;white-space:pre-wrap;direction:ltr;text-align:left}
.pvw .stage audio{width:min(520px,100%)}
.pvw .nav-b{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:grid;place-items:center}
.pvw .nav-b:hover{background:rgba(255,255,255,.22)}
.pvw .prev{right:12px}.pvw .next{left:12px}
.pvw .nofile{color:#c5cbc8;text-align:center}
.pvw .nofile svg{width:72px;height:84px}
/* uploads */
.upl{position:fixed;bottom:20px;inset-inline-end:20px;z-index:55;width:380px;max-width:calc(100% - 24px);background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);display:none;overflow:hidden}
.upl.show{display:block}
.upl .hd{display:flex;align-items:center;gap:6px;padding:12px 12px 12px 16px;font-weight:700;border-bottom:1px solid var(--border)}
.upl .hd span{flex:1}
.upl .list{max-height:280px;overflow:auto}
.upl.min .list{display:none}
.ui{display:flex;align-items:center;gap:12px;padding:10px 16px}
.ui .fi{width:28px;height:28px}
.ui .fi svg{width:24px;height:28px}
.ui div.t{flex:1;min-width:0}
.ui b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui small{font-size:13px;color:var(--text-3)}
.ui .pb{height:5px;border-radius:5px;background:var(--surface-3);margin-top:5px;overflow:hidden}
.ui .pb i{display:block;height:100%;width:0;background:var(--primary);transition:width .15s}
.ui.ok .pb i{background:var(--success)}
.ui.err .pb i{background:var(--danger)}
.ui .st{width:20px;height:20px;color:var(--text-3)}
.ui.ok .st{color:var(--success)}
.ui.err .st{color:var(--danger)}
.upl .sum{padding:10px 16px;font-size:13px;color:var(--text-3);border-bottom:1px solid var(--border)}
.upl .sum .pb{height:5px;border-radius:5px;background:var(--surface-3);overflow:hidden;margin-bottom:6px}
.upl .sum .pb i{display:block;height:100%;width:0;background:var(--primary);transition:width .2s}
.upl .sum.done .pb i{background:var(--success)}
.upl .sum .row{display:flex;gap:8px;align-items:center}
.upl .sum .row span{flex:1}
.upl.min .sum{border-bottom:0}
/* toasts */
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:12px;background:var(--text);color:var(--surface);box-shadow:var(--shadow-lg);font-size:14.5px;animation:tin .2s ease;pointer-events:auto;max-width:calc(100vw - 32px)}
.toast svg{width:18px;height:18px}
.toast.ok svg{color:#7bcf98}.toast.err svg{color:#ff8f7d}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
/* avatars, pickers, admin */
.av{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:var(--primary)}
.av svg{width:15px;height:15px}
.plist{display:flex;flex-direction:column;gap:8px;max-height:min(52vh,420px);overflow:auto;margin:0 0 16px;padding:2px}
.pi{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);cursor:pointer;text-align:start;color:var(--text)}
.pi:hover{border-color:var(--primary);background:var(--primary-soft)}
.pi.on{border-color:var(--primary);background:var(--primary-soft)}
.pi .av{width:36px;height:36px;font-size:15px}
.pi .t{flex:1;min-width:0}
.pi .t b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .t small{display:block;color:var(--text-3);font-size:13px}
.pi .x{display:flex;gap:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.two .pi{flex-direction:column;align-items:center;text-align:center;padding:20px 10px;gap:8px}
.two .pi svg{width:28px;height:28px;color:var(--primary)}
.two .pi small{color:var(--text-3);font-size:13px}
.frm{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:0 0 8px}
.frm .input{margin:0}
.frm.two{grid-template-columns:1fr auto}
.ttl{display:grid;gap:10px;margin:0 0 16px;padding:14px;border-radius:14px;background:var(--surface-2)}
.ttl .tr,.tr.pfx{display:flex;align-items:center;gap:8px;height:auto;border:0;padding:0;grid-template-columns:none;background:none;box-shadow:none}
.ttl .tr:hover,.tr.pfx:hover{box-shadow:none;border:0}
.tr.pfx{margin:0 0 10px}
.tr.pfx label,.ttl label{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap}
.ttl label{min-width:140px}
.tr.pfx .input{width:180px;height:40px;margin:0;text-align:left}
.ttl small{font-size:13px;color:var(--text-3);line-height:1.8}
.ttl .input{flex:1;min-width:0;margin:0;height:40px;background:var(--surface)}
.ipbox{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:48px;padding:6px 10px;margin:0 0 6px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);direction:ltr;cursor:text}
.ipbox:focus-within{border-color:var(--primary);background:var(--surface);box-shadow:var(--ring)}
.ipbox .chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.ipbox .chip button{width:22px;height:22px;border:0;border-radius:50%;background:none;color:var(--text-2);cursor:pointer;display:grid;place-items:center;font-size:16px;line-height:1}
.ipbox .chip button:hover{background:var(--surface-3)}
.ipbox .pre{color:var(--text-3);font-size:15px;font-variant-numeric:tabular-nums;padding-left:4px}
.ipbox input{flex:1;min-width:150px;height:32px;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:15px;padding:0}
.hint{font-size:13px;color:var(--text-3);margin:0 0 14px}
.sec-t{font-size:16px;font-weight:800;color:var(--text);margin:20px 0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--border);font-size:13px;color:var(--text-2);direction:ltr}
.empty-s{padding:16px;text-align:center;color:var(--text-3);font-size:14px;border:1px dashed var(--border-strong);border-radius:12px}
.kseg{display:flex;padding:3px;margin:4px 0 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border)}
.kseg button{flex:1;height:38px;border:0;border-radius:999px;background:none;color:var(--text-2);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.kseg button .i{width:16px;height:16px}
.kseg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.kseg button:disabled{opacity:.4;cursor:default}
/* settings tabs, recycle bin */
.stabs{display:flex;gap:4px;padding:4px;margin:0 0 18px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.stabs::-webkit-scrollbar{display:none}
.stabs button{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border:0;border-radius:999px;background:none;color:var(--text-2);font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.stabs button svg{width:16px;height:16px}
.stabs button:hover{color:var(--text)}
.stabs button.on{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-sm)}
.dlg section[hidden]{display:none}
.dlg section{min-height:260px}
.field{display:grid;gap:8px;margin:0 0 14px}
.sp-row .sp-code{width:150px;height:36px;margin:0;text-align:left}
.sp-row .t a{color:var(--primary);text-decoration:none;word-break:break-all}
.sp-row .t a:hover{text-decoration:underline}
@media (max-width:640px){.sp-row{flex-wrap:wrap}.sp-row .sp-code{flex:1}}
.field label{font-size:14px;font-weight:700}
.field .input{margin:0}
.pacts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.binbar{display:flex;align-items:center;gap:8px;padding:8px 12px;margin:0 0 10px;border-radius:12px;background:var(--surface-2);font-size:14px;color:var(--text-2)}
.binbar .sp,.dlg .acts .sp{flex:1}
.btn.danger-o{color:var(--danger)}
.btn.danger-o:hover:not(:disabled){background:var(--danger-soft);border-color:var(--danger)}
.binl{max-height:min(56vh,460px)}
.bi{cursor:pointer}
.bi.on{border-color:var(--primary);background:var(--primary-soft)}
.bi .fi{background:var(--surface-2);color:var(--text-2)}
.bi .fi svg{width:18px;height:18px}
.bi .t small{white-space:normal;line-height:1.7}
.bi .sz{font-size:13.5px;color:var(--text-3);white-space:nowrap}
@media (max-width:640px){.stabs button span{display:none}.stabs button.on span{display:inline}.dlg .acts{flex-wrap:wrap}.binbar{flex-wrap:wrap}}
/* Drive overrides for shared pieces */
.banner{box-shadow:none;border-radius:10px;background:var(--surface);border:1px solid var(--border)}
.banner .bi{background:var(--primary-soft);color:var(--primary);border-radius:50%}
.selbar{height:48px;border-radius:10px;background:var(--primary-soft);color:var(--on-soft);box-shadow:none}
.selbar .btn{background:none;border:0;color:var(--on-soft)}
.selbar .btn:hover{background:color-mix(in srgb,var(--primary) 12%,transparent)}
.empty{box-shadow:none;background:none}
.skel{background:none;border-bottom:1px solid var(--border);border-radius:0;height:56px;margin:0;padding:0 50px}
.dlg{border-radius:12px}
.dlg h3{font-weight:600}
.menu{border-radius:8px;padding:6px 0}
.menu button{border-radius:0;height:36px;padding:0 18px}
.toast{border-radius:6px;background:#323232;color:#fff}
/* responsive */
@media (max-width:1180px){.host{display:none}.thead,.tr{grid-template-columns:40px minmax(0,1fr) 160px 110px 48px}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:64px minmax(0,1fr)}
  .menu-btn{display:inline-flex}
  .top{grid-column:1;padding:0 8px;gap:6px}
  .search{height:44px;padding:0 14px}
  .content{grid-column:1;padding:0 0 96px}
  .phead{padding:14px 16px 12px}
  .cols{padding:16px 16px 0}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:280px;z-index:65;transform:translateX(105%);transition:transform .22s ease;box-shadow:var(--shadow-lg)}
  .side.open{transform:none}
  .side-scrim.show{display:block;position:fixed;inset:0;z-index:64;background:rgba(32,33,36,.45)}
  .new-btn{display:none}
  #upBtn{display:inline-flex;position:fixed;bottom:20px;inset-inline-end:16px;z-index:40;height:56px;width:56px;padding:0;border-radius:16px;box-shadow:0 4px 12px rgba(26,115,232,.4)}
  #upBtn span{display:none}
  .me .mt{display:none}
  .me{margin:0}
  .me .av{width:32px;height:32px}
  .top-acts .ticon:not(#themeBtn){display:none}
  .fl,.stats{display:none}
  .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
  .filters::-webkit-scrollbar{display:none}
  .chips{flex-wrap:nowrap}
  .chips button{flex:none}
  .tools .ticon#shareBtn{display:none}
  .nav2{display:flex!important}
  .nav .mob:not([hidden]){display:flex}
}
@media (max-width:640px){
  .thead{display:none}
  .tr{grid-template-columns:36px minmax(0,1fr) 44px;height:60px}
  .cell-d,.cell-s{display:none}
  .cell-n .nm small{display:block}
  .more,.fcard .more{opacity:1}
  .fcards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .fcard{padding:0 6px 0 12px;gap:10px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .gc .pv{height:100px}
  #ptitle{font-size:19px}
  .banner{flex-wrap:wrap}.banner .back{width:100%}
  .pvw .stage{padding:0 8px 16px}
  .pvw .nav-b{display:none}
  .frm{grid-template-columns:1fr}
}
/* long names are never cut off: they wrap (two lines in cards, in full in the details and icon views) */
.fcard{height:auto;min-height:56px;padding-block:8px}
.fc-n b,.cell-n .nm b,.gc .meta b{white-space:normal;text-overflow:clip;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere;line-height:1.5}
.tr{height:auto;min-height:56px;padding-block:6px}
.v-details .cell-n .nm b,.sr-list .cell-n .nm b{display:block;-webkit-line-clamp:unset;line-clamp:none;overflow:visible}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.tl{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px 12px;border-radius:12px;text-align:center;user-select:none;transition:background .1s}
.tl:hover{background:var(--row-hover)}
.tl.sel{background:var(--primary-soft)}
.tl .ti{width:64px;height:64px;display:grid;place-items:center;cursor:pointer;border-radius:8px;overflow:hidden}
.tl .ti img{width:100%;height:100%;object-fit:cover}
.tl .ti svg{width:44px;height:54px}
.tl .ti .fold{width:64px;height:64px}
.tl b{font-size:13.5px;font-weight:600;line-height:1.5;overflow-wrap:anywhere;cursor:pointer;max-width:100%}
.tl.sel b{color:var(--on-soft)}
.tl small{font-size:12px;color:var(--text-3)}
.tl .cb{position:absolute;top:8px;inset-inline-start:8px}
.tl .cb input{opacity:0}
.tl:hover .cb input,.tl.sel .cb input,.tiles.selecting .cb input{opacity:1}
.tl .more{position:absolute;top:4px;inset-inline-end:4px}
.tl:hover .more,.tl.sel .more{opacity:1}
/* drag onto a folder to move */
.drop-in{outline:2px dashed var(--primary);outline-offset:-2px;background:var(--primary-soft)!important}
.dragghost{position:fixed;top:-100px;inset-inline-start:0;padding:6px 12px;border-radius:8px;background:var(--primary);color:#fff;font-size:13px;font-weight:600}
/* menus */
.menu .mh{padding:6px 12px 4px;font-size:12.5px;color:var(--text-3)}
.menu button.on{color:var(--primary);font-weight:600}
.menu button svg.ok{margin-inline-start:auto;color:var(--primary)}
.sg .kbd{margin-inline-start:auto;font-size:12px;color:var(--text-3);border:1px solid var(--border);border-radius:5px;padding:1px 6px}
.sg-w{max-width:45%;overflow:hidden;text-overflow:ellipsis;display:block}
/* move dialog */
.mv-sp{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.mv-sp button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--text-2);font:inherit;font-size:13.5px;cursor:pointer}
.mv-sp button svg{width:16px;height:16px}
.mv-sp button.on{background:var(--primary-soft);border-color:transparent;color:var(--on-soft);font-weight:600}
.mv-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin:0 0 8px;font-size:14px}
.mv-crumbs button{border:0;background:none;color:var(--text-2);font:inherit;cursor:pointer;padding:3px 6px;border-radius:6px}
.mv-crumbs button:last-of-type{color:var(--text);font-weight:600}
.mv-crumbs button:hover{background:var(--surface-2)}
.mv-crumbs svg{width:14px;height:14px;color:var(--text-3)}
.mv-list{display:flex;flex-direction:column;min-height:120px;max-height:min(42vh,340px);overflow:auto;border:1px solid var(--border);border-radius:12px;padding:4px;margin:0 0 12px}
.mv-list button{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:6px 10px;border:0;border-radius:8px;background:none;color:var(--text);font:inherit;font-size:14.5px;text-align:start;cursor:pointer}
.mv-list button:hover{background:var(--surface-2)}
.mv-list button:disabled{opacity:.4;cursor:not-allowed}
.mv-list button span{flex:1;min-width:0;overflow-wrap:anywhere}
.mv-list .fold{width:22px;height:22px;flex:none}
.mv-list button>svg.i{width:16px;height:16px;color:var(--text-3)}
.mv-empty{padding:28px 12px;text-align:center;color:var(--text-3);font-size:14px}
.mv-empty.err{color:var(--danger)}
.mv-new{display:flex;gap:8px;margin:0 0 12px}
.mv-new .input{flex:1;margin:0}
.mv-new[hidden]{display:none}
.mv-q{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.mv-q svg{width:18px;height:18px;color:var(--text-3);flex:none}
.mv-q .input{flex:1;margin:0}
.mv-list button small{display:block;font-size:12px;color:var(--text-3);font-weight:400}
.mv-list .mv-up{color:var(--primary);font-weight:600;border-bottom:1px solid var(--border);border-radius:8px 8px 0 0}
.mv-list .mv-up svg{width:16px;height:16px}
.mv-here{font-size:13px;color:var(--text-2);margin:0 0 10px;overflow-wrap:anywhere}
.inarch{display:inline-flex;align-items:center;gap:4px;margin-inline-start:2px;padding:0 6px;border-radius:6px;background:var(--surface-2);color:var(--text-2);font-size:11.5px;vertical-align:middle}
.inarch svg{width:12px;height:12px}
/* search results */
.sr-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:0 0 16px}
.sr-t{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--text-2)}
.sr-t svg{width:18px;height:18px}
.sr-t b{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1}
.chips .sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.chip{height:32px;padding:0 14px;border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--text-2);font:inherit;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--primary-soft);border-color:transparent;color:var(--on-soft);font-weight:600}
.sr-list .tr{cursor:pointer}
.sr-list.busy{opacity:.6}
mark{background:color-mix(in srgb,var(--primary) 20%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.sg-n mark{color:var(--text);font-weight:700}
.loc{display:inline-flex;align-items:center;gap:5px;max-width:100%;margin-top:2px;padding:1px 6px 1px 4px;border:0;border-radius:6px;background:none;color:var(--text-3);font:inherit;font-size:12.5px;cursor:pointer;text-align:start}
.loc:hover{background:var(--surface-2);color:var(--primary)}
.loc svg{width:14px;height:14px;flex:none}
.loc span{overflow-wrap:anywhere}
@media (max-width:900px){
  .tiles{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  .tl .more{opacity:1}
  .sg-w{display:none}
}
/* admin: activity log, alerts, encryption */
.alertbar{position:fixed;top:0;inset-inline:0;z-index:70;display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;background:#c62828;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:abIn .25s ease}
.alertbar[hidden]{display:none}
.alertbar>svg{width:24px;height:24px;flex:none;animation:abPulse 1.2s ease-in-out infinite}
.alertbar .ab-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.alertbar .ab-t b{font-size:15px}
.alertbar .ab-t>span{font-size:13px;opacity:.92;overflow-wrap:anywhere}
.alertbar .ab-n{font-size:12.5px;background:rgba(255,255,255,.2);border-radius:10px;padding:2px 8px;white-space:nowrap}
.alertbar .btn{background:rgba(255,255,255,.16);border:0;color:#fff}
.alertbar .btn:hover{background:rgba(255,255,255,.28)}
@keyframes abIn{from{transform:translateY(-100%)}to{transform:none}}
@keyframes abPulse{50%{opacity:.45}}
.bell{position:relative}
.bell.hot{color:#c62828}
.bell .bdg{position:absolute;top:3px;inset-inline-end:2px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#c62828;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.bell .bdg[hidden]{display:none}
.kvs{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:12px;margin:0 0 12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border-bottom:1px solid var(--border);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--text-2)}
.kv b{font-weight:600;text-align:end;overflow-wrap:anywhere}
.dz{color:var(--danger)}
.frm.pw3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.lgf{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;margin:0 0 10px}
.lgf .input{margin:0}
.lgl{display:flex;flex-direction:column;max-height:min(46vh,420px);overflow:auto;border:1px solid var(--border);border-radius:12px}
.lg{display:grid;grid-template-columns:150px 150px minmax(0,1fr);gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);font-size:13.5px;align-items:start}
.lg:last-child{border-bottom:0}
.lg.al{background:color-mix(in srgb,#c62828 7%,transparent)}
.lg-t{color:var(--text-3);font-size:12.5px}
.lg-w,.lg-a{display:flex;flex-direction:column;gap:2px;min-width:0}
.lg-w small,.lg-a small{color:var(--text-3);font-size:12.5px;overflow-wrap:anywhere}
.lg-w small{text-align:right}
.lg-a .tg{align-self:flex-start;font-size:11.5px;padding:0 6px;border-radius:6px;background:var(--danger-soft)}
.sw{display:flex;align-items:center;gap:10px;font-size:14px;margin:0 0 8px;cursor:pointer}
.sw input{width:18px;height:18px}
@media (max-width:700px){.frm.pw3,.lgf{grid-template-columns:1fr}.lg{grid-template-columns:1fr}.alertbar{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

"use strict";
const $ = s => document.querySelector(s);
const S = {cur: "/", items: [], ro: false, view: "details", sr: null, sort: {k: "name", asc: true}, filter: "all", q: "", sel: new Set(), anchor: null, loading: true, admin: false, me: null, people: [], ip: ""};
try { S.view = ({list: "details"})[localStorage.getItem("lfs-view")] || localStorage.getItem("lfs-view") || "details"; const so = JSON.parse(localStorage.getItem("lfs-sort") || "null"); if (so) S.sort = so; } catch {}

/* ---------- helpers ---------- */
const enc = p => p.split("/").map(encodeURIComponent).join("/");
const join = (a, b) => (a.endsWith("/") ? a : a + "/") + b;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const faNum = s => String(s).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
const fmt = n => { if (n < 1024) return faNum(n) + " بایت"; const u = ["کیلوبایت","مگابایت","گیگابایت","ترابایت"]; let i = -1; do { n /= 1024; i++ } while (n >= 1024 && i < 3); return faNum(n.toFixed(n < 10 ? 1 : 0)) + " " + u[i]; };
const dfmt = new Intl.DateTimeFormat("fa-IR", {year: "numeric", month: "short", day: "numeric"});
const tfmt = new Intl.DateTimeFormat("fa-IR", {hour: "2-digit", minute: "2-digit"});
function when(t) {
  const d = new Date(t * 1000), now = new Date(), diff = (now - d) / 1000;
  if (diff < 60) return "همین حالا";
  if (diff < 3600) return faNum(Math.floor(diff / 60)) + " دقیقه پیش";
  if (d.toDateString() === now.toDateString()) return "امروز، " + tfmt.format(d);
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return "دیروز، " + tfmt.format(d);
  return dfmt.format(d);
}
const icon = (id, cls = "i") => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;
const ext = n => { const i = n.lastIndexOf("."); return i > 0 ? n.slice(i + 1).toLowerCase() : ""; };
const TYPES = {
  image: {re: /^(jpe?g|png|gif|webp|bmp|svg|heic|avif|ico)$/, c: "#0ea5e9"},
  video: {re: /^(mp4|mkv|avi|mov|webm|wmv|m4v|flv)$/, c: "#8b5cf6"},
  audio: {re: /^(mp3|wav|ogg|m4a|flac|aac|wma)$/, c: "#ec4899"},
  archive: {re: /^(zip|rar|7z|tar|gz|bz2|xz|iso)$/, c: "#a16207"},
  pdf: {re: /^pdf$/, c: "#e11d48"},
  word: {re: /^(docx?|rtf|odt)$/, c: "#2563eb"},
  sheet: {re: /^(xlsx?|csv|ods)$/, c: "#16a34a"},
  slide: {re: /^(pptx?|odp)$/, c: "#ea580c"},
  code: {re: /^(txt|md|log|json|xml|html?|css|js|ts|py|go|java|c|cpp|cs|sql|ini|cfg|yml|yaml|bat|ps1|sh)$/, c: "#64748b"},

function kind(it) {
  if (it.isDir) return "folder";
  const e = ext(it.name);
  for (const k in TYPES) if (TYPES[k].re.test(e)) return k;
  return "file";

// read a dropped folder tree (Chrome / Edge / Firefox)
async function dropEntries(dt) {
  const roots = [...dt.items || []].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (!roots.length) return [...dt.files].map(f => ({f, rel: f.name}));
  const out = [];
  const readAll = r => new Promise(res => { const acc = []; const step = () => r.readEntries(es => { if (!es.length) return res(acc); acc.push(...es); step(); }, () => res(acc)); step(); });
  const walk = async (e, pre) => {
    if (e.isFile) { const f = await new Promise(res => e.file(res, () => res(null))); if (f) out.push({f, rel: pre + f.name}); }
    else if (e.isDirectory) {
      const kids = await readAll(e.createReader());
      if (!kids.length) out.push({dir: pre + e.name});
      for (const k of kids) await walk(k, pre + e.name + "/");
    }
  };
  for (const e of roots) await walk(e, "");
  return out;
}
async function enqueueTree(entries, dest) {
  // empty folders have no files: create them directly
  const dirs = entries.filter(e => e.dir), files = entries.filter(e => e.f);
  for (const d of dirs) { UQ.made = UQ.made.size ? UQ.made : new Map(); await ensureDir(join(dest, d.dir), dest).catch(() => {}); }
  if (files.length) enqueue(files, dest); else if (dirs.length) { toast("پوشه ساخته شد"); load(S.cur, true); }
}

function origFa(p) {
  if (!p || p === "/") return "فضای مشترک";
  const parts = p.split("/").filter(Boolean);
  let head = "فضای مشترک";
  if (parts[0] && parts[0].startsWith(":")) { const sp = spaceOf("/" + parts[0]); head = sp ? sp.name : "پوشه‌ی حذف‌شده"; parts.shift(); }
  return [head, ...parts].join(" › ");
}

    <button class="btn sm" id="srClose">${icon("x")}بستن جستجو</button></div>`;
  if (s.busy && !s.res.length) h += `<div class="panel">${Array.from({length: 5}, (_, i) => `<div class="skel"><i style="width:36px;height:36px;border-radius:8px"></i><i style="width:${30 + (i * 13) % 35}%"></i></div>`).join("")}</div>`;
  else if (!s.res.length) h += `<div class="panel"><div class="empty"><h3>چیزی پیدا نشد</h3><p>بخشی از نام را بنویسید یا املای دیگری را امتحان کنید. جستجو نام همه‌ی فایل‌ها و پوشه‌ها را در همه‌ی زیرپوشه‌ها بررسی می‌کند (حروف عربی/فارسی، اعداد فارسی و نیم‌فاصله یکسان در نظر گرفته می‌شوند).</p></div></div>`;
  else h += `<div class="panel sr-list ${s.busy ? "busy" : ""}"><div class="thead"><div></div><div>نام و محل</div><div class="hd-d">آخرین تغییر</div><div class="hd-s">اندازه</div><div></div></div>` +
    s.res.map((it, i) => `<div class="tr" data-i="${i}">
      <div></div>
      <div class="cell-n"><div class="fi" data-open>${it.isDir ? FOLDER : it.inner ? fileSvg(it) : thumb(it, it.path)}</div><div class="nm"><b data-open title="${esc(it.name)}">${hlq(it.name, s.q)}</b>${it.inner ? `<span class="inarch">${icon("zip")}داخل فایل فشرده</span>` : ""}<button class="loc" data-loc title="${it.inner ? "باز کردن پوشه‌ی فایل فشرده" : "باز کردن پوشه‌ای که این مورد در آن است"}">${icon(it.inner ? "zip" : spaceOf(it.path) ? "lock" : "folder")}<span>${esc(hitLoc(it))}</span></button></div></div>
      <div class="cell-d num">${when(it.mtime)}</div><div class="cell-s num">${it.isDir ? "—" : fmt(it.size)}</div>
      <div><button class="btn ghost sm icon more" data-more>${icon("more")}</button></div></div>`).join("") + "</div>";
  v.innerHTML = h;
  v.querySelectorAll(".chip").forEach(b => b.onclick = () => { s[b.dataset.k] = b.dataset.v; runResults(); });
  $("#srClose").onclick = () => { clearSearch(); render(); };
  v.querySelectorAll(".tr[data-i]").forEach(el => {
    const it = s.res[+el.dataset.i];
    el.onclick = e => { if (e.target.closest("[data-loc],[data-more]")) return; open(it); };
    el.querySelector("[data-loc]").onclick = e => { e.stopPropagation(); goItem(it.path, false, false); };
    const menu = r => {
      const m = $("#menu"), b = (a, ic, t) => `<button data-a="${a}">${icon(ic)}<span>${t}</span></button>`;
      const zipFile = it.inner && !it.isDir && archKind(it.path) === "zip";
      m.innerHTML = it.inner ? (zipFile ? b("idl", "download", "دانلود همین فایل از داخل zip") : "") + b("loc", "zip", "رفتن به فایل فشرده") + b("adl", "download", "دانلود کل فایل فشرده")
        : (it.isDir ? b("open", "open", "باز کردن") : b("open", "eye", "پیش‌نمایش") + b("dl", "download", "دانلود")) + b("loc", "folder", "رفتن به محل آن") + (S.ro ? "" : "<hr>" + b("mv", "move", "انتقال به…"));
      m.classList.add("show");
      m.style.left = Math.max(8, Math.min(r.right - m.offsetWidth, innerWidth - m.offsetWidth - 8)) + "px";
      m.style.top = (r.bottom + 4 + m.offsetHeight > innerHeight - 8 ? Math.max(8, r.top - m.offsetHeight - 4) : r.bottom + 4) + "px";
      m.querySelectorAll("button").forEach(x => x.onclick = () => { hideMenu(); ({open: () => open(it), dl: () => download(it), idl: () => download(it), adl: () => download({path: it.path, name: it.path.split("/").pop()}), loc: () => goItem(it.path, false, false), mv: () => moveDlg([it.path])})[x.dataset.a](); });
    };
    el.querySelector("[data-more]").onclick = e => { e.stopPropagation(); menu(e.currentTarget.getBoundingClientRect()); };
    el.oncontextmenu = e => { e.preventDefault(); e.stopPropagation(); menu({left: e.clientX, right: e.clientX, top: e.clientY, bottom: e.clientY}); };
  });
  renderSel();
}
$("#q").oninput = e => {
  S.q = e.target.value; const raw = S.q.trim();
  clearTimeout(SQ.t);
  if (S.sr) { if (!raw) { S.sr = null; render(); } else { S.sr.q = raw; SQ.t = setTimeout(runResults, 220); } return; }
  render(); sugg();
  if (raw) SQ.t = setTimeout(() => searchApi(raw, {limit: 60}).then(j => { SQ.g = {q: raw, j}; sugg(); }).catch(() => {}), 140);
};
$("#q").onfocus = sugg;
$("#q").onblur = () => setTimeout(sugg, 0);
$("#q").addEventListener("keydown", e => {
  const bs = [...$("#sugg").querySelectorAll(".sg")], k = bs.indexOf(document.querySelector(".sg.kb"));
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); bs.forEach(b => b.classList.remove("kb")); const n = bs[(k + (e.key === "ArrowDown" ? 1 : -1) + bs.length) % bs.length]; if (n) n.classList.add("kb"); }
  else if (e.key === "Enter") { e.preventDefault(); const b = k >= 0 ? bs[k] : null; if (b) b.dispatchEvent(new MouseEvent("mousedown")); else { $("#q").blur(); if (!S.sr) showResults(); else { clearTimeout(SQ.t); runResults(); } } }
});
$("#qClear").onclick = () => { clearSearch(); render(); $("#q").focus(); };
$("#vList").onclick = () => setView("details"); $("#vGrid").onclick = () => setView("grid");
function setView(v) { S.view = v; try { localStorage.setItem("lfs-view", v); } catch {} render(); }
$("#vToggle").onclick = e => {
  e.stopPropagation(); const r = e.currentTarget.getBoundingClientRect(), m = $("#menu");
  if (m.classList.contains("show") && m.dataset.k === "view") return hideMenu();
  m.dataset.k = "view";
  m.innerHTML = `<div class="mh">شیوه‌ی نمایش</div>` + VIEWS.map(([k, ic, t]) => `<button data-v="${k}" class="${S.view === k ? "on" : ""}">${icon(ic)}<span>${t}</span>${S.view === k ? icon("check", "i ok") : ""}</button>`).join("");
  m.classList.add("show");
  m.style.left = Math.max(8, Math.min(r.left, innerWidth - m.offsetWidth - 8)) + "px"; m.style.top = (r.bottom + 6) + "px";
  m.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { hideMenu(); setView(b.dataset.v); });
};
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => { S.filter = b.dataset.f; S.sel.clear(); closeSide(); render(); });
document.querySelector(".brand").style.cursor = "pointer";
document.querySelector(".brand").onclick = () => goSpace("/");
$("#selClear").onclick = () => { S.sel.clear(); render(); };
$("#selZip").onclick = () => zipDl(selected().map(i => i.name));
$("#selDel").onclick = () => del(selected());
$("#selMove").onclick = () => moveDlg(selected().map(i => join(S.cur, i.name)));
$("#content").addEventListener("click", e => { if (!e.target.closest("[data-n],.selbar,.hero,button") && S.sel.size) { S.sel.clear(); render(); } });

let dc = 0;
addEventListener("dragenter", e => { if (S.ro || ![...(e.dataTransfer?.types || [])].includes("Files")) return; e.preventDefault(); dc++; $("#drop").classList.add("show"); });
addEventListener("dragleave", () => { if (--dc <= 0) { dc = 0; $("#drop").classList.remove("show"); } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", async e => {
  e.preventDefault(); dc = 0; $("#drop").classList.remove("show");
  if ([...(e.dataTransfer?.types || [])].includes(DRAG)) return; // an item moved inside the page, not an upload
  if (S.ro || !e.dataTransfer?.items?.length && !e.dataTransfer?.files?.length) return;
  const dest = S.cur, entries = await dropEntries(e.dataTransfer);
  if (entries.length) enqueueTree(entries, dest);
});

addEventListener("keydown", e => {
  if ($("#scrim").classList.contains("show")) return;
  if ($("#pvw").classList.contains("show")) {
    if (e.key === "Escape") pvClose(); else if (e.key === "ArrowLeft") pvGo(1); else if (e.key === "ArrowRight") pvGo(-1);
    return;
  }
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === "Escape") { hideMenu(); if (typing) { $("#q").blur(); } else if (S.sel.size) { S.sel.clear(); render(); } else if (S.sr || S.q) { clearSearch(); render(); } return; }
  if (typing) return;
  if (S.sr) { if (e.key === "/" || ((e.ctrlKey || e.metaKey) && e.code === "KeyK")) { e.preventDefault(); $("#q").focus(); $("#q").select(); } else if (e.key === "Backspace") { clearSearch(); render(); } return; }
  if ((e.ctrlKey || e.metaKey) && e.code === "KeyM" && S.sel.size && !S.ro) { e.preventDefault(); moveDlg(selected().map(i => join(S.cur, i.name))); return; }
  if (e.key === "/" || ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K" || e.code === "KeyK"))) { e.preventDefault(); $("#q").focus(); $("#q").select(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "a") { e.preventDefault(); visible().forEach(i => S.sel.add(i.name)); render(); }
  else if (e.key === "Delete" && S.sel.size && !S.ro) del(selected());
  else if (e.key === "F2" && S.sel.size === 1 && !S.ro) { e.preventDefault(); rename(selected()[0]); }
  else if (e.key === "Enter" && S.sel.size === 1) open(selected()[0]);
  else if (e.key === "Backspace" && S.cur !== "/") load(S.cur.replace(/\/[^/]+\/?$/, "") || "/");
});

themeIcon();
refreshInfo().then(() => load(decodeURIComponent(location.hash.slice(1)) || "/")).catch(() => {});
</script>
</body>
</html>
